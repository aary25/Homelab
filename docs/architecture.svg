<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,monospace">
  <defs>
    <marker id="arr-cyan" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#06b6d4"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#a855f7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a2236" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" fill="#0d1117" rx="10"/>
  <rect width="960" height="700" fill="url(#grid)" rx="10"/>

  <!-- ══════════════════════════════════ TITLE ══════════════════════════════════ -->
  <text x="480" y="28" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="-0.3">Homelab Architecture</text>
  <text x="480" y="46" text-anchor="middle" fill="#8b949e" font-size="10" font-family="system-ui,sans-serif">Proxmox VE 8 · Debian 13 Trixie · Docker · Tailscale · playit.gg</text>

  <!-- ══════════════════════════ INTERNET ZONE ══════════════════════════ -->
  <rect x="15" y="58" width="930" height="100" fill="#161b22" rx="8" stroke="#30363d" stroke-width="1"/>
  <text x="480" y="73" text-anchor="middle" fill="#8b949e" font-size="9" font-family="system-ui,sans-serif" letter-spacing="2">INTERNET</text>

  <!-- Admin devices (left) -->
  <rect x="28" y="80" width="155" height="65" fill="#0d2137" rx="6" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="105" y="99" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="700" font-family="system-ui,sans-serif">Admin Devices</text>
  <text x="105" y="114" text-anchor="middle" fill="#c9d1d9" font-size="9">Windows Desktop · MSI Laptop</text>
  <text x="105" y="128" text-anchor="middle" fill="#8b949e" font-size="8">Tailscale clients installed</text>
  <text x="105" y="139" text-anchor="middle" fill="#8b949e" font-size="8">ssh aary@100.92.79.114</text>

  <!-- DuckDNS center -->
  <rect x="380" y="80" width="200" height="65" fill="#0d1b2e" rx="6" stroke="#1f6feb" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="480" y="100" text-anchor="middle" fill="#388bfd" font-size="10" font-weight="700" font-family="system-ui,sans-serif">DuckDNS</text>
  <text x="480" y="115" text-anchor="middle" fill="#c9d1d9" font-size="9">aarylab.duckdns.org</text>
  <text x="480" y="129" text-anchor="middle" fill="#8b949e" font-size="8">cron every 5 min · tracks dynamic WAN IP</text>
  <text x="480" y="141" text-anchor="middle" fill="#f85149" font-size="8">⚠ blocked by ISP CG-NAT for inbound</text>

  <!-- Minecraft players (right) -->
  <rect x="777" y="80" width="155" height="65" fill="#1a0d29" rx="6" stroke="#a855f7" stroke-width="1.2"/>
  <text x="854" y="99" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="700" font-family="system-ui,sans-serif">Minecraft Players</text>
  <text x="854" y="114" text-anchor="middle" fill="#c9d1d9" font-size="9">physical-scared</text>
  <text x="854" y="128" text-anchor="middle" fill="#c9d1d9" font-size="9">.gl.joinmc.link</text>
  <text x="854" y="141" text-anchor="middle" fill="#8b949e" font-size="8">no VPN required</text>

  <!-- ══════════════ CG-NAT BARRIER ══════════════ -->
  <rect x="15" y="165" width="930" height="26" fill="#160000" rx="4" stroke="#da3633" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="480" y="182" text-anchor="middle" fill="#f85149" font-size="9" font-weight="600" font-family="system-ui,sans-serif" letter-spacing="0.5">⚠  CG-NAT BARRIER — WAN: 10.104.6.249 — Inbound port-forwarding blocked by ISP — outbound tunnels only</text>

  <!-- ══════════════ ROUTER ══════════════ -->
  <rect x="15" y="197" width="930" height="40" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="480" y="212" text-anchor="middle" fill="#8b949e" font-size="9" font-family="system-ui,sans-serif" letter-spacing="2">HOME NETWORK</text>
  <text x="480" y="229" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600" font-family="system-ui,sans-serif">NETGEAR Nighthawk RAX48 — 192.168.1.1 — DHCP MAC reservations: all 3 devices</text>

  <!-- ══════════════════════════════ PROXMOX HOST ══════════════════════════════ -->
  <rect x="15" y="243" width="930" height="446" fill="#0d1117" rx="10" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="27" y="261" fill="#8b949e" font-size="9" font-family="system-ui,sans-serif" letter-spacing="2">PROXMOX VE 8</text>
  <text x="480" y="261" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="700" font-family="system-ui,sans-serif">Dell OptiPlex 7050 SFF — Intel i7-6700 (4C/8T) — 24 GB DDR4 — 192.168.1.5</text>

  <!-- ══════════════════════ VM 100 ══════════════════════ -->
  <rect x="28" y="270" width="570" height="412" fill="#010409" rx="8" stroke="#238636" stroke-width="1.2"/>
  <text x="313" y="289" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700" font-family="system-ui,sans-serif">VM 100 · debian</text>
  <text x="313" y="303" text-anchor="middle" fill="#8b949e" font-size="9">192.168.1.6 · Tailscale 100.92.79.114 · 8 GB RAM · Debian 13 Trixie · Docker host</text>

  <!-- Security -->
  <rect x="42" y="312" width="265" height="68" fill="#160b0b" rx="6" stroke="#da3633" stroke-width="1"/>
  <text x="174" y="329" text-anchor="middle" fill="#f85149" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">SECURITY</text>
  <text x="174" y="346" text-anchor="middle" fill="#ffa198" font-size="11" font-weight="600">UFW · Fail2ban</text>
  <text x="174" y="361" text-anchor="middle" fill="#8b949e" font-size="8">default-deny inbound · SSH key auth</text>
  <text x="174" y="373" text-anchor="middle" fill="#8b949e" font-size="8">passwords disabled · 3 retry ban · 1h bantime</text>

  <!-- Infrastructure -->
  <rect x="322" y="312" width="265" height="68" fill="#0b1120" rx="6" stroke="#1f6feb" stroke-width="1"/>
  <text x="454" y="329" text-anchor="middle" fill="#388bfd" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">INFRASTRUCTURE</text>
  <text x="454" y="346" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="600">Docker · Portainer · NPM</text>
  <text x="454" y="361" text-anchor="middle" fill="#8b949e" font-size="8">Portainer :9443 · Nginx Proxy Manager :81</text>
  <text x="454" y="373" text-anchor="middle" fill="#8b949e" font-size="8">auto TLS via Let's Encrypt · subdomain routing</text>

