  <rect x="626" y="654" width="292" height="22" fill="#100c00" rx="4" stroke="#d29922" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="772" y="669" text-anchor="middle" fill="#e3b341" font-size="8">onboot: 1 · ens18 declared in /etc/network/interfaces</text>

