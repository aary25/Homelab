  <rect x="42" y="546" width="545" height="22" fill="#0d1b2e" rx="4" stroke="#1f6feb" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="314" y="561" text-anchor="middle" fill="#388bfd" font-size="8.5">Tailscale Funnel exposes Calibre-Web to the internet via HTTPS — no open ports — outbound-only tunnel</text>

  <!-- MAC note VM100 bottom -->
  <rect x="42" y="576" width="545" height="22" fill="#030d06" rx="4" stroke="#238636" stroke-width="0.5" stroke-dasharray="4,2"/>
