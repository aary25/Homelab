  <text x="120.5" y="128" text-anchor="middle" fill="#8b949e" font-size="8">Tailscale · DNS via Pi-hole</text>
  <text x="120.5" y="139" text-anchor="middle" fill="#8b949e" font-size="8">ssh aary@100.92.79.114</text>

  <!-- DuckDNS center -->
