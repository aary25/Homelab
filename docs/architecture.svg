  <!-- VM100 bottom note: onboot -->
  <rect x="42" y="606" width="545" height="22" fill="#100c00" rx="4" stroke="#d29922" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="314" y="621" text-anchor="middle" fill="#e3b341" font-size="8.5">onboot: 1 — VM auto-starts on Proxmox host power-on · self-recovered after network change</text>

