  <!-- ══════════════════════ VM 100 ══════════════════════ -->
  <rect x="28" y="270" width="560" height="416" fill="#010409" rx="8" stroke="#238636" stroke-width="1.2"/>
  <text x="308" y="289" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700" font-family="system-ui,sans-serif">VM 100 · debian</text>
  <text x="308" y="303" text-anchor="middle" fill="#8b949e" font-size="9">192.168.1.6 · Tailscale 100.92.79.114 · 8 GB RAM · Docker host · Ansible control node</text>

  <!-- Row 1 · Security -->
  <rect x="42" y="312" width="260" height="68" fill="#160b0b" rx="6" stroke="#da3633" stroke-width="1"/>
  <text x="172" y="329" text-anchor="middle" fill="#f85149" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">SECURITY</text>
  <text x="172" y="346" text-anchor="middle" fill="#ffa198" font-size="11" font-weight="600">UFW · Fail2ban · SSH keys</text>
  <text x="172" y="361" text-anchor="middle" fill="#8b949e" font-size="8">default-deny inbound · passwords disabled</text>
  <text x="172" y="373" text-anchor="middle" fill="#8b949e" font-size="8">Fail2ban: 3 retries → 1h ban</text>

  <!-- Row 1 · Infrastructure -->
  <rect x="317" y="312" width="260" height="68" fill="#0b1120" rx="6" stroke="#1f6feb" stroke-width="1"/>
  <text x="447" y="329" text-anchor="middle" fill="#388bfd" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">INFRASTRUCTURE</text>
  <text x="447" y="346" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="600">Docker · Portainer · NPM</text>
  <text x="447" y="361" text-anchor="middle" fill="#8b949e" font-size="8">Portainer :9443 · Nginx Proxy Manager :81</text>
  <text x="447" y="373" text-anchor="middle" fill="#8b949e" font-size="8">auto TLS via Let's Encrypt · subdomain routing</text>

