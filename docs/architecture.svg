  <rect x="42" y="390" width="265" height="68" fill="#0b160b" rx="6" stroke="#238636" stroke-width="1"/>
  <text x="174" y="407" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">DEV PLATFORM</text>
  <text x="174" y="424" text-anchor="middle" fill="#56d364" font-size="11" font-weight="600">Gitea · Woodpecker CI/CD</text>
  <text x="174" y="439" text-anchor="middle" fill="#8b949e" font-size="8">Gitea :3000 · self-hosted Git server</text>
  <text x="174" y="451" text-anchor="middle" fill="#8b949e" font-size="8">Woodpecker :8000 · pipeline on every push</text>

  <!-- Observability -->
  <rect x="322" y="390" width="265" height="68" fill="#161106" rx="6" stroke="#d29922" stroke-width="1"/>
  <text x="454" y="407" text-anchor="middle" fill="#e3b341" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">OBSERVABILITY</text>
  <text x="454" y="424" text-anchor="middle" fill="#f0c860" font-size="11" font-weight="600">Prometheus · Grafana</text>
  <text x="454" y="439" text-anchor="middle" fill="#8b949e" font-size="8">Node Exporter :9100 · Prometheus :9090</text>
  <text x="454" y="451" text-anchor="middle" fill="#8b949e" font-size="8">Grafana :3001 · dashboard #1860 · alerting</text>

  <!-- Applications -->
  <rect x="42" y="468" width="265" height="68" fill="#110b1a" rx="6" stroke="#8957e5" stroke-width="1"/>
  <text x="174" y="485" text-anchor="middle" fill="#bc8cff" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">APPLICATIONS</text>
  <text x="174" y="502" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="600">Calibre-Web</text>
  <text x="174" y="517" text-anchor="middle" fill="#8b949e" font-size="8">:8083 · ebook library + management</text>
  <text x="174" y="529" text-anchor="middle" fill="#8b949e" font-size="8">Tailscale Funnel → public HTTPS access</text>

  <!-- Remote Access / Tailscale -->
  <rect x="322" y="468" width="265" height="68" fill="#061a1a" rx="6" stroke="#0891b2" stroke-width="1"/>
  <text x="454" y="485" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">REMOTE ACCESS</text>
  <text x="454" y="502" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">Tailscale</text>
  <text x="454" y="517" text-anchor="middle" fill="#8b949e" font-size="8">WireGuard-based mesh VPN · punches CG-NAT</text>
  <text x="454" y="529" text-anchor="middle" fill="#8b949e" font-size="8">Funnel: debian.tail5b5a2a.ts.net (HTTPS)</text>

