  <text x="772" y="330" text-anchor="middle" fill="#f0883e" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">MINECRAFT SERVER</text>
  <text x="772" y="348" text-anchor="middle" fill="#ffa657" font-size="11" font-weight="600">itzg/minecraft-server</text>
  <text x="772" y="364" text-anchor="middle" fill="#c9d1d9" font-size="9">VERSION: LATEST · Java Edition</text>
  <text x="772" y="378" text-anchor="middle" fill="#8b949e" font-size="8">INIT_MEMORY: 2G · MAX_MEMORY: 10G</text>
  <text x="772" y="390" text-anchor="middle" fill="#8b949e" font-size="8">Aikar JVM flags · port :25565</text>
  <text x="772" y="402" text-anchor="middle" fill="#8b949e" font-size="8">World: named Docker volume (minecraft_data)</text>
  <text x="772" y="416" text-anchor="middle" fill="#8b949e" font-size="8">RCON: docker exec -i minecraft-1 rcon-cli</text>

  <!-- playit.gg agent -->
  <rect x="626" y="436" width="292" height="70" fill="#120829" rx="6" stroke="#a855f7" stroke-width="1"/>
  <text x="772" y="453" text-anchor="middle" fill="#d2a8ff" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">TUNNEL AGENT</text>
  <text x="772" y="470" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">playit.gg</text>
  <text x="772" y="485" text-anchor="middle" fill="#8b949e" font-size="8">systemd service · auto-start on boot</text>
  <text x="772" y="497" text-anchor="middle" fill="#c9d1d9" font-size="8">physical-scared.gl.joinmc.link</text>

  <!-- Node Exporter VM101 -->
  <rect x="626" y="516" width="292" height="55" fill="#161106" rx="6" stroke="#d29922" stroke-width="1"/>
  <text x="772" y="533" text-anchor="middle" fill="#e3b341" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">MONITORING</text>
  <text x="772" y="549" text-anchor="middle" fill="#f0c860" font-size="11" font-weight="600">Node Exporter :9100</text>
  <text x="772" y="562" text-anchor="middle" fill="#8b949e" font-size="8">host networking · scraped by Prometheus on VM 100</text>

  <!-- VM101 MAC note -->
  <rect x="626" y="581" width="292" height="22" fill="#030d06" rx="4" stroke="#238636" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="772" y="596" text-anchor="middle" fill="#3fb950" font-size="8">MAC BC:24:11:01:39:B6 · ens18 via ifupdown</text>

  <!-- VM101 onboot note -->
  <rect x="626" y="611" width="292" height="22" fill="#100c00" rx="4" stroke="#d29922" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="772" y="626" text-anchor="middle" fill="#e3b341" font-size="8">onboot: 1 · ens18 declared in /etc/network/interfaces</text>

  <!-- ══════════════════════ CONNECTION LINES ══════════════════════ -->

  <!-- Tailscale: Admin devices → VM 100 -->
  <path d="M 183 145 L 183 197" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5,3" fill="none" opacity="0.8" marker-end="url(#arr-cyan)"/>
  <text x="150" y="175" fill="#06b6d4" font-size="8" font-family="system-ui,sans-serif" text-anchor="middle">Tailscale</text>
  <text x="150" y="185" fill="#8b949e" font-size="7" font-family="system-ui,sans-serif" text-anchor="middle">WireGuard</text>

  <!-- playit.gg: Players → VM 101 -->
  <path d="M 854 145 L 854 197" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3" fill="none" opacity="0.8" marker-end="url(#arr-purple)"/>
  <text x="890" y="175" fill="#a855f7" font-size="8" font-family="system-ui,sans-serif" text-anchor="middle">playit.gg</text>
  <text x="890" y="185" fill="#8b949e" font-size="7" font-family="system-ui,sans-serif" text-anchor="middle">relay</text>

