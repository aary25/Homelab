  <path d="M 587 424 L 600 424 L 600 543 L 626 543" stroke="#d29922" stroke-width="1.2" stroke-dasharray="4,2" fill="none" opacity="0.7" marker-end="url(#arr-amber)"/>
  <text x="601" y="418" fill="#e3b341" font-size="7.5" font-family="system-ui,sans-serif">scrape :9100</text>
  <text x="601" y="428" fill="#8b949e" font-size="7" font-family="system-ui,sans-serif">15s interval</text>

