  <text x="772" y="424" text-anchor="middle" fill="#56d364" font-size="11" font-weight="600">UFW · Fail2ban · SSH · Docker</text>
  <text x="772" y="439" text-anchor="middle" fill="#8b949e" font-size="8">applied by Ansible from VM 100</text>
  <text x="772" y="451" text-anchor="middle" fill="#8b949e" font-size="8">default-deny inbound · key-only SSH</text>

