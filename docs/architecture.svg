  <text x="172" y="407" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">GITOPS</text>
  <text x="172" y="424" text-anchor="middle" fill="#56d364" font-size="11" font-weight="600">Gitea → Woodpecker CI</text>
  <text x="172" y="439" text-anchor="middle" fill="#8b949e" font-size="8">docker-stacks repo · path-filtered deploys</text>
  <text x="172" y="451" text-anchor="middle" fill="#8b949e" font-size="8">Gitea :3000 · Woodpecker :8000 · main protected</text>

